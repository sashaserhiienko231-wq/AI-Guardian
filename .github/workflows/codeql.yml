# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 12 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: python
          build-mode: none
        # The iOS/macOS Swift files are stock Flutter runner delegates and
        # generated plugin registrants; there is no maintained app-specific
        # Swift implementation to analyze or build.
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Android is nested under apps/mobile/android and has no tracked Gradle
    # wrapper. Use the Flutter SDK and the Gradle version declared by the
    # project's wrapper properties.
    - name: Set up Java for Android analysis
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Flutter for Android analysis
      if: matrix.language == 'java-kotlin'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.5'

    - name: Resolve Flutter dependencies for Android analysis
      if: matrix.language == 'java-kotlin'
      working-directory: apps/mobile
      run: flutter pub get

    - name: Prepare Android Gradle configuration
      if: matrix.language == 'java-kotlin'
      shell: bash
      working-directory: apps/mobile
      run: |
        flutter_sdk="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
        android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        test -d "$flutter_sdk"
        test -d "$android_sdk"
        printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_sdk" "$android_sdk" > android/local.properties

    - name: Set up Gradle for Android analysis
      if: matrix.language == 'java-kotlin'
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.14'
        cache-read-only: false
        cache-overwrite-existing: true

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    - name: Build Android debug APK for CodeQL
      if: matrix.language == 'java-kotlin' && matrix.build-mode == 'manual'
      shell: bash
      working-directory: apps/mobile
      run: |
        # Retry only Maven HTTP 429 responses, with bounded exponential backoff.
        # All other build errors fail immediately and the final 429 remains fatal.
        max_attempts=4
        for attempt in $(seq 1 "$max_attempts"); do
          log_file="$(mktemp)"
          if flutter build apk --debug --no-pub 2>&1 | tee "$log_file"; then
            rm -f "$log_file"
            exit 0
          else
            build_status=${PIPESTATUS[0]}
          fi

          if ! grep -Eq 'Received status code 429|HTTP 429|status code: 429' "$log_file"; then
            rm -f "$log_file"
            exit "$build_status"
          fi
          rm -f "$log_file"

          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "Build still received HTTP 429 after $max_attempts attempts." >&2
            exit "$build_status"
          fi

          delay=$((15 * (2 ** (attempt - 1))))
          echo "Maven returned HTTP 429; retrying in ${delay}s (attempt $((attempt + 1))/$max_attempts)." >&2
          sleep "$delay"
        done

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
